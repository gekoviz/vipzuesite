<!doctype html>
<!-- Recorte do voo da águia (prólogo da Hero desktop) — ferramenta local, fora do site publicado.
     Abra no Chrome (arquivo local), escolha o master (IMG_5747.MP4, fundo branco) e a pasta de saída
     (assets/hero/voo). Gera voo-000.webp … voo-NNN.webp (1600×890, WebP 0,8 com alfa) e manifest.json.
     O master não é alterado. Mesmo algoritmo e parâmetros que geraram os quadros publicados (06/11/2026):
     · alfa pela distância do branco (255 − min(R,G,B)), rampa suave entre LO e HI;
     · só é fundo o claro LIGADO À BORDA (inundação a partir das bordas): brilhos do bico e dos olhos ficam opacos;
     · erosão de 1px no alfa (tira o fio claro da borda);
     · cor dos pixels de borda puxada da média dos vizinhos internos (raio 2) — sem halo branco sobre Mocha/Páprica. -->
<html lang="pt-BR">
<meta charset="utf-8">
<title>Recortar voo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #2a2420; color: #f3ede3; }
  button, input { font: inherit; }
  canvas { display: block; max-width: 100%; margin-top: 16px; background: #5b4632; }
</style>
<p><input type="file" id="src" accept="video/mp4,video/*"> <button id="go" disabled>Escolher pasta e exportar</button></p>
<p id="log">Escolha o master.</p>
<canvas id="prev"></canvas>
<script>
const OUT = { w: 1600, h: 890, fps: 24, quality: 0.8 };
const KEY = { lo: 20, hi: 110, er: 1, cr: 2 };
const log = (t) => (document.getElementById("log").textContent = t);
const V = document.createElement("video");
V.muted = true;
V.preload = "auto";

document.getElementById("src").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  V.src = URL.createObjectURL(f);
  await new Promise((r) => (V.onloadedmetadata = r));
  const n = Math.floor(V.duration * OUT.fps + 1e-6) + 1;
  log(`${f.name}: ${V.videoWidth}×${V.videoHeight}, ${V.duration.toFixed(3)}s → ${n} quadros a ${OUT.fps} fps`);
  document.getElementById("go").disabled = false;
};

const seek = (i) => new Promise((r) => { V.onseeked = r; V.currentTime = Math.min(V.duration, (i + 0.5) / OUT.fps); });

function key(W, H) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(V, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data, N = W * H;
  const dist = new Uint8Array(N);
  for (let p = 0, q = 0; p < N; p++, q += 4) dist[p] = 255 - Math.min(d[q], d[q + 1], d[q + 2]);
  // fundo = claro ligado à borda
  const bg = new Uint8Array(N), st = new Int32Array(N);
  let sp = 0;
  const push = (p) => { if (!bg[p] && dist[p] < KEY.hi) { bg[p] = 1; st[sp++] = p; } };
  for (let i = 0; i < W; i++) { push(i); push((H - 1) * W + i); }
  for (let j = 0; j < H; j++) { push(j * W); push(j * W + W - 1); }
  while (sp) { const p = st[--sp], px = p % W; if (px > 0) push(p - 1); if (px < W - 1) push(p + 1); if (p >= W) push(p - W); if (p < N - W) push(p + W); }
  let A = new Float32Array(N);
  for (let p = 0; p < N; p++) {
    if (!bg[p]) { A[p] = 1; continue; }
    const t = Math.min(1, Math.max(0, (dist[p] - KEY.lo) / (KEY.hi - KEY.lo)));
    A[p] = t * t * (3 - 2 * t);
  }
  for (let e = 0; e < KEY.er; e++) {
    const B = new Float32Array(N);
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const p = j * W + i; let m = A[p];
      if (m > 0) { if (i > 0) m = Math.min(m, A[p - 1]); if (i < W - 1) m = Math.min(m, A[p + 1]); if (j > 0) m = Math.min(m, A[p - W]); if (j < H - 1) m = Math.min(m, A[p + W]); }
      B[p] = m;
    }
    A = B;
  }
  const inner = new Uint8Array(N);
  for (let j = 1; j < H - 1; j++) for (let i = 1; i < W - 1; i++) { const p = j * W + i; inner[p] = A[p] >= 1 && A[p - 1] >= 1 && A[p + 1] >= 1 && A[p - W] >= 1 && A[p + W] >= 1 ? 1 : 0; }
  const out = new Uint8ClampedArray(d.length), R = KEY.cr;
  for (let p = 0, q = 0; p < N; p++, q += 4) {
    const a = A[p];
    if (a <= 0.004) continue;
    if (inner[p]) { out[q] = d[q]; out[q + 1] = d[q + 1]; out[q + 2] = d[q + 2]; out[q + 3] = 255; continue; }
    const i = p % W, j = (p / W) | 0; let r = 0, g = 0, b = 0, n = 0;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const ii = i + dx, jj = j + dy;
      if (ii < 0 || jj < 0 || ii >= W || jj >= H) continue;
      const pp = jj * W + ii;
      if (inner[pp]) { const qq = pp * 4; r += d[qq]; g += d[qq + 1]; b += d[qq + 2]; n++; }
    }
    if (n) { out[q] = r / n; out[q + 1] = g / n; out[q + 2] = b / n; }
    else for (let k = 0; k < 3; k++) out[q + k] = (d[q + k] - (1 - a) * 255) / Math.max(a, 0.05);
    out[q + 3] = Math.round(a * 255);
  }
  x.putImageData(new ImageData(out, W, H), 0, 0);
  return c;
}

document.getElementById("go").onclick = async () => {
  const dir = await window.showDirectoryPicker({ mode: "readwrite" });
  const n = Math.floor(V.duration * OUT.fps + 1e-6) + 1;
  const frames = [];
  const prev = document.getElementById("prev"), px = prev.getContext("2d");
  prev.width = OUT.w / 4; prev.height = OUT.h / 4;
  for (let i = 0; i < n; i++) {
    await seek(i);
    const c = key(OUT.w, OUT.h);
    const blob = await new Promise((r) => c.toBlob(r, "image/webp", OUT.quality));
    const name = `voo-${String(i).padStart(3, "0")}.webp`;
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(blob); await w.close();
    frames.push(`assets/hero/voo/${name}`);
    px.clearRect(0, 0, prev.width, prev.height); px.drawImage(c, 0, 0, prev.width, prev.height);
    log(`${i + 1}/${n} — ${name} (${(blob.size / 1024).toFixed(0)} KB)`);
  }
  const manifest = { source: "IMG_5747.MP4 (1928x1072, 24 fps, 241 quadros, 10,04 s)", fps: OUT.fps, width: OUT.w, height: OUT.h, frames };
  const mh = await dir.getFileHandle("manifest.json", { create: true });
  const mw = await mh.createWritable(); await mw.write(JSON.stringify(manifest) + "\n"); await mw.close();
  log(`Pronto: ${n} quadros e manifest.json.`);
};
</script>
</html>
