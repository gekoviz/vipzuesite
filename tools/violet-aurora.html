<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Violet Aurora</title>
  <style>
    /* "Violet Aurora Gradient Hero Background" (21st.dev, estilo Bloom Field / mesh):
       um blob radial por cor, cada um ancorado no seu ponto, sobre o fundo #140B2E, com grão em overlay.
       O CSS abaixo é o quadro estático (t = 0), idêntico ao CSS de referência; o script o recalcula a cada quadro. */
    html,
    body {
      height: 100%;
      margin: 0;
    }

    .gradient {
      position: fixed;
      inset: 0;
      background-color: #140b2e;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.030'/></svg>"), radial-gradient(circle at 56.18% 53.14%, rgba(20, 11, 46, 1) 0%, rgba(20, 11, 46, 0.844) 19.02%, rgba(20, 11, 46, 0.5) 38.05%, rgba(20, 11, 46, 0.156) 57.07%, rgba(20, 11, 46, 0) 76.1%), radial-gradient(circle at 40.93% 70.24%, rgba(20, 11, 46, 1) 0%, rgba(20, 11, 46, 0.844) 17.71%, rgba(20, 11, 46, 0.5) 35.42%, rgba(20, 11, 46, 0.156) 53.14%, rgba(20, 11, 46, 0) 70.85%), radial-gradient(circle at 58% 14.42%, rgba(109, 74, 255, 1) 0%, rgba(109, 74, 255, 0.844) 12.9%, rgba(109, 74, 255, 0.5) 25.8%, rgba(109, 74, 255, 0.156) 38.7%, rgba(109, 74, 255, 0) 51.6%), radial-gradient(circle at 65% 81.01%, rgba(60, 2, 164, 1) 0%, rgba(60, 2, 164, 0.844) 13.34%, rgba(60, 2, 164, 0.5) 26.68%, rgba(60, 2, 164, 0.156) 40.01%, rgba(60, 2, 164, 0) 53.35%), radial-gradient(circle at 16.23% 47.68%, rgba(109, 74, 255, 1) 0%, rgba(109, 74, 255, 0.844) 12.46%, rgba(109, 74, 255, 0.5) 24.93%, rgba(109, 74, 255, 0.156) 37.39%, rgba(109, 74, 255, 0) 49.85%), radial-gradient(circle at 94% 31.96%, rgba(196, 160, 255, 1) 0%, rgba(196, 160, 255, 0.844) 11.59%, rgba(196, 160, 255, 0.5) 23.18%, rgba(196, 160, 255, 0.156) 34.76%, rgba(196, 160, 255, 0) 46.35%);
      background-size: 120px 120px, auto, auto, auto, auto, auto, auto;
      background-blend-mode: overlay, normal, normal, normal, normal, normal, normal;
    }
  </style>
</head>
<body>
  <div class="gradient" aria-hidden="true"></div>

  <script>
    (() => {
      const el = document.querySelector(".gradient");
      // Grão (mesmo SVG do CSS), codificado para ser reaplicado a cada quadro
      const GRAIN_SVG =
        "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(#n)' opacity='0.030'/></svg>";
      const GRAIN = `url("data:image/svg+xml,${encodeURIComponent(GRAIN_SVG)}")`;

      // Blobs na ordem da paleta: centro (%), raio final (%), cor e intensidade (o "@ N%" de cada cor).
      // O CSS exportado empilha a 1ª cor por cima (no CSS a 1ª camada é a do topo) e com opacidade 1:
      // os dois blobs night violet cobrem os coloridos e o resultado fica quase liso. Aqui a pilha segue a
      // ordem do gerador (1ª cor embaixo, última em cima) e cada blob usa a sua intensidade.
      const BLOBS = [
        { x: 56.18, y: 53.14, r: 76.1, rgb: "20, 11, 46", k: 1 },
        { x: 40.93, y: 70.24, r: 70.85, rgb: "20, 11, 46", k: 0.85 },
        { x: 58, y: 14.42, r: 51.6, rgb: "109, 74, 255", k: 0.3 },
        { x: 65, y: 81.01, r: 53.35, rgb: "60, 2, 164", k: 0.35 },
        { x: 16.23, y: 47.68, r: 49.85, rgb: "109, 74, 255", k: 0.25 },
        { x: 94, y: 31.96, r: 46.35, rgb: "196, 160, 255", k: 0.15 },
      ];
      const STOPS = [
        [1, 0],
        [0.844, 0.25],
        [0.5, 0.5],
        [0.156, 0.75],
        [0, 1],
      ];

      // Movimento: ph = t * 0.20, amt = 0.25. Fase ESTÁTICA por blob (hash da semente, calculado uma vez);
      // cada deslocamento é exatamente 0 em ph = 0 (sin(x + p) − sin(p)), então não há salto no início.
      const SEED = 184;
      const SPEED = 0.2;
      const AMT = 0.25;
      const hash = (n) => {
        const v = Math.sin(n) * 43758.5453;
        return v - Math.floor(v);
      };
      BLOBS.forEach((b, i) => {
        b.p = hash(SEED * 12.9898 + i * 78.233) * Math.PI * 2;
        b.p2 = hash(SEED * 39.3468 + i * 11.135) * Math.PI * 2;
      });

      const layer = (b, ph) => {
        const x = b.x + (Math.sin(ph * 0.55 + b.p) - Math.sin(b.p)) * 14 * AMT;
        const y = b.y + (Math.sin(ph * 0.43 + b.p2) - Math.sin(b.p2)) * 14 * AMT;
        // sem arredondamento: valores contínuos a cada quadro
        const stops = STOPS.map(([a, f]) => `rgba(${b.rgb}, ${a * b.k}) ${b.r * f}%`).join(", ");
        return `radial-gradient(circle at ${x}% ${y}%, ${stops})`;
      };

      const render = (ph) => {
        // grão no topo; depois os blobs da última cor para a primeira (a primeira fica no fundo)
        el.style.backgroundImage = [GRAIN, ...BLOBS.map((b) => layer(b, ph)).reverse()].join(", ");
      };

      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      // Relógio acumulado (segundos): pausas não fazem a fase voltar nem saltar
      let t = 0;
      let last = null;
      let raf = 0;
      const frame = (now) => {
        if (last !== null) t += (now - last) / 1000;
        last = now;
        render(t * SPEED);
        raf = requestAnimationFrame(frame);
      };
      const play = () => {
        if (!raf && !reduce.matches && !document.hidden) raf = requestAnimationFrame(frame);
      };
      const stop = () => {
        cancelAnimationFrame(raf);
        raf = 0;
      };

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stop();
          last = null; // ao voltar, continua do mesmo t
        } else play();
      });
      render(0); // quadro inicial na mesma pilha da animação (também o estado com movimento reduzido)
      reduce.addEventListener("change", () => {
        if (reduce.matches) {
          stop();
          last = null;
        } else play();
      });
      play();
    })();
  </script>
</body>
</html>
