<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Preparar assets</title>
<style>body{font:14px system-ui;background:#555;color:#fff;padding:24px}img{max-width:240px;background:repeating-conic-gradient(#888 0 25%,#aaa 0 50%) 0 0/16px 16px;margin:8px}</style>
</head>
<body>
<p>Recorta a área transparente excedente e exporta as versões web. Não altera os originais em assets/source.</p>
<pre id="log"></pre>
<div id="out"></div>
<script>
const jobs = [
  // [origem, destino, formato, qualidade, largura máxima, margem em px]
  ["assets/source/brand/vipzue-logo-marfim.png", "assets/brand/vipzue-logo-marfim.png", "image/png", 1, 1200, 0],
  ["assets/source/brand/vipzue-logo-champagne.png", "assets/brand/vipzue-logo-champagne.png", "image/png", 1, 1200, 0],
  ["assets/source/brand/vipzue-logo-marrom.png", "assets/brand/vipzue-logo-marrom.png", "image/png", 1, 1200, 0],
  // A águia recebe o ajuste tonal da Hero já gravado no arquivo (evita filter CSS animado/escalado).
  ["assets/source/hero/aguia.png", "assets/hero/aguia-1400.webp", "image/webp", 0.9, 1400, 8, "saturate(0.92) contrast(1.04)"],
  ["assets/source/hero/aguia.png", "assets/hero/aguia-900.webp", "image/webp", 0.88, 900, 8, "saturate(0.92) contrast(1.04)"],];
const log = (m) => (document.getElementById("log").textContent += m + "\n");

function load(src) {
  return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
}

function alphaBox(img) {
  const c = new OffscreenCanvas(img.naturalWidth, img.naturalHeight);
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const { data, width, height } = x.getImageData(0, 0, c.width, c.height);
  let minX = width, minY = height, maxX = -1, maxY = -1, opaqueCorner = data[3] > 200;
  for (let y = 0; y < height; y++) for (let i = 0; i < width; i++) {
    if (data[(y * width + i) * 4 + 3] > 8) {
      if (i < minX) minX = i; if (i > maxX) maxX = i; if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  return { minX, minY, maxX, maxY, opaqueCorner };
}

(async () => {
  for (const [src, dest, type, q, maxW, pad, filter] of jobs) {
    const img = await load("/" + src);
    const b = alphaBox(img);
    const sx = Math.max(0, b.minX - pad), sy = Math.max(0, b.minY - pad);
    const sw = Math.min(img.naturalWidth, b.maxX + 1 + pad) - sx, sh = Math.min(img.naturalHeight, b.maxY + 1 + pad) - sy;
    const scale = Math.min(1, maxW / sw);
    const c = document.createElement("canvas");
    c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
    if (filter) x.filter = filter;
    x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, type, q));
    const r = await fetch("/__save?path=" + encodeURIComponent(dest), { method: "POST", body: blob });
    log(`${dest}: ${img.naturalWidth}x${img.naturalHeight} -> recorte ${sw}x${sh} @${sx},${sy} -> ${c.width}x${c.height}, ${(blob.size / 1024).toFixed(0)} KB, canto opaco=${b.opaqueCorner}, ${r.status}`);
    const el = new Image(); el.src = "/" + dest + "?t=" + Date.now(); document.getElementById("out").append(el);
  }
  log("concluído");
})().catch((e) => log("ERRO " + e));
</script>
</body>
</html>
