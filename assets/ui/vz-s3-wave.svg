<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <!-- VIPZUE · Seção 03 · onda luminosa dos cards (08/11/2026). Uma única curva líquida (Bézier) desenhada para a quina
       inferior esquerda; o CSS espelha/gira a janela para as outras quinas. Camadas: penumbra Páprica Profunda, corpo
       Páprica → Champagne que se dissolve longe da quina, brilho interno e o contorno luminoso fino na crista.
       Só vetor: sem raster, vídeo, shader ou canvas. -->
  <defs>
    <filter id="soft-wide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="penumbra" gradientUnits="userSpaceOnUse" cx="240" cy="910" r="660">
      <stop offset="0" stop-color="#9F3930" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#9F3930" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9F3930" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="230" cy="920" r="560">
      <stop offset="0" stop-color="#D7673F" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#E07A4C" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#FFD5A6" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#F0A273" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D7673F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crest" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#FFD5A6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FFE9D2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD5A6" stop-opacity="0.85"/>
      <stop offset="0.82" stop-color="#FFD5A6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFD5A6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#FFE2C2" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#FFE2C2" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFE2C2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFE2C2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- penumbra quente, larga e desfocada -->
  <path filter="url(#soft-wide)" fill="url(#penumbra)"
        d="M0,280 C150,280 260,440 370,545 C480,650 570,760 730,830 C830,875 920,905 1000,912 L1000,1000 L0,1000 Z"/>
  <!-- corpo da onda: núcleo Páprica na quina, Champagne no meio, dissolvido nas bordas -->
  <path filter="url(#soft)" fill="url(#core)"
        d="M0,340 C140,335 235,480 330,580 C425,680 500,770 640,835 C740,880 860,915 1000,930 L1000,1000 L0,1000 Z"/>
  <!-- brilho interno logo abaixo da crista -->
  <path filter="url(#glow)" fill="none" stroke="#FFD5A6" stroke-opacity="0.38" stroke-width="26" stroke-linecap="round"
        d="M0,368 C138,364 228,505 320,603 C412,703 492,792 632,856 C732,900 858,934 1000,950"/>
  <!-- contorno luminoso fino da crista (halo + traço) -->
  <path filter="url(#glow)" fill="none" stroke="url(#crest)" stroke-opacity="0.6" stroke-width="12" stroke-linecap="round"
        d="M0,340 C140,335 235,480 330,580 C425,680 500,770 640,835 C740,880 860,915 1000,930"/>
  <path fill="none" stroke="url(#crest)" stroke-width="4.5" stroke-linecap="round"
        d="M0,340 C140,335 235,480 330,580 C425,680 500,770 640,835 C740,880 860,915 1000,930"/>
  <!-- segunda linha, mais baixa e discreta: o "líquido" em camadas -->
  <path fill="none" stroke="url(#inner)" stroke-width="2.4" stroke-linecap="round"
        d="M0,470 C130,470 215,580 305,665 C395,750 480,820 610,865 C710,900 850,936 1000,952"/>
</svg>
